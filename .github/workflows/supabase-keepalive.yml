# Supabase 무료 플랜은 "지난 한 주 동안 충분한 활동"이 없으면 프로젝트를 일시정지한다.
# 공식 문서 기준: "하루에 몇 건 정도의 DB 요청이 일주일 내내" 있어야 충분하다 —
# 즉 "7일간 0건만 아니면 됨"이 아니다. 3일에 1회(요청 2건)로는 기준 미달이라
# 2026-07-24 경고 메일이 다시 왔다(known_issues 참고). 그래서 하루 4회 돌린다.
# 일시정지되면 배포된 사이트의 온라인 대전만 조용히 실패한다(로컬·AI 대전은 무관).
# 낡은 방 정리를 겸한다 — 어차피 필요한 유지보수이고, 그 요청이 "활동"으로 잡힌다.
#
# 정리 기준은 앱과 동일하다: updated_at 이 24시간 지난 방 삭제
# (src/mp/room.ts 의 cleanupOldRooms — 방 생성 시에도 같은 기준으로 호출된다).
#
# 주의: GitHub 은 공개 레포에 60일간 커밋(push)이 없으면 schedule 워크플로를 자동 비활성화한다.
# 2026-09-15 실제로 경고 메일이 왔다(마지막 커밋 07-24). 이슈·태그·PR 은 활동으로 안 치고 커밋만 친다.
# 그래서 매 실행마다 이 워크플로를 API 로 강제 enable 해 60일 카운터를 리셋한다(첫 스텝).
# 메일의 "workflows page 에서 방지" 버튼과 같은 동작이며, 기본 GITHUB_TOKEN(actions: write)이면 된다.
# 한 번 꺼지면 이후 커밋을 해도 저절로 안 켜지므로 deploy.yml 의 push 때도 같은 API 로 다시 켠다.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 0,6,12,18 * * *' # 하루 4회(6시간마다), 매회 DB 요청 2건 = 일 8건
  workflow_dispatch:

permissions:
  actions: write # 아래 "자기 자신 다시 켜기" 용. 그 외 권한은 필요 없다.

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 60일 비활성화 방지(자기 자신 강제 enable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"

      - name: 낡은 방 정리 + 핑
        env:
          # 브라우저에 원래 실리는 공개 값이다(src/mp/supabase.ts 와 동일). 비밀 키가 아니다.
          # 실제 권한은 DB 의 RLS 정책이 담당한다.
          SUPABASE_URL: https://nvadbcrlgfzoppnvhoru.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52YWRiY3JsZ2Z6b3BwbnZob3J1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMzkzOTksImV4cCI6MjA5NzgxNTM5OX0.h0nVnP8Hg6qO0GjQoY0YlpQzZBxVQHrE1BluRf6GwFA
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "정리 기준: updated_at < $cutoff"

          deleted=$(curl -sS --fail-with-body \
            -X DELETE "$SUPABASE_URL/rest/v1/rooms?updated_at=lt.$cutoff&select=id" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Prefer: return=representation")
          echo "삭제한 낡은 방: $(echo "$deleted" | jq 'length')"

          remaining=$(curl -sS --fail-with-body \
            "$SUPABASE_URL/rest/v1/rooms?select=id" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "남은 방: $(echo "$remaining" | jq 'length')"
