<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>html,body{margin:0;height:100%}</style>
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
</helmet>
<div style="width:100%; height:100vh; min-height:480px; background:#ece6da; display:flex; flex-direction:column; font-family:'Poppins',system-ui,sans-serif;">
  <div style="padding:14px 22px; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap;">
    <div style="font-size:18px; font-weight:700; letter-spacing:-0.01em; color:#3a2410;">Be the Bee — 3D 말 (실사)</div>
    <div style="font-size:12px; color:#9a6b34; letter-spacing:0.03em;">드래그로 회전 · 스크롤로 확대 · 우측 Tweaks에서 진영·여왕벌 전환</div>
  </div>
  <div ref="{{ setMount }}" style="flex:1; min-height:0; width:100%;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:520},&quot;faction&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;brown&quot;,&quot;gold&quot;],&quot;default&quot;:&quot;brown&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;queen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;autoRotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    this._setMount = this._setMount || ((el) => { this.mountEl = el; });
    return { setMount: this._setMount };
  }

  componentDidMount() {
    this._mounted = true;
    this.cam = { radius: 6.6, theta: 0.62, phi: 0.74 };
    this.target = { x: 0, y: 0.55, z: 0 };
    this.drag = null;
    this.waitForReady(() => this.initScene());
  }

  waitForReady(cb, n) {
    n = n || 0;
    if (window.THREE && this.mountEl && this.mountEl.clientWidth) return cb();
    if (n > 300) { console.error('init timeout', { three: !!window.THREE, mount: !!this.mountEl }); return; }
    setTimeout(() => this.waitForReady(cb, n + 1), 40);
  }
  componentWillUnmount() {
    this._mounted = false;
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    if (this._three && this._three.renderer) this._three.renderer.dispose();
  }
  componentDidUpdate(prev) {
    if (this._three && (prev.faction !== this.props.faction || prev.queen !== this.props.queen)) this.buildPiece();
  }

  waitForThree(cb, n) {
    n = n || 0;
    if (window.THREE) return cb();
    if (n > 240) { console.error('three.js load timeout'); return; }
    setTimeout(() => this.waitForThree(cb, n + 1), 50);
  }

  updateCamera() {
    const c = this.cam, t = this.target, cam = this._three.camera;
    const x = t.x + c.radius * Math.sin(c.phi) * Math.sin(c.theta);
    const y = t.y + c.radius * Math.cos(c.phi);
    const z = t.z + c.radius * Math.sin(c.phi) * Math.cos(c.theta);
    cam.position.set(x, y, z);
    cam.lookAt(t.x, t.y, t.z);
  }

  bindControls(dom) {
    dom.style.touchAction = 'none';
    dom.style.cursor = 'grab';
    const down = (e) => { this.drag = { x: e.clientX, y: e.clientY }; dom.style.cursor = 'grabbing'; };
    const move = (e) => {
      if (!this.drag) return;
      const dx = e.clientX - this.drag.x, dy = e.clientY - this.drag.y;
      this.drag = { x: e.clientX, y: e.clientY };
      this.cam.theta -= dx * 0.008;
      this.cam.phi = Math.max(0.16, Math.min(1.46, this.cam.phi - dy * 0.008));
    };
    const up = () => { this.drag = null; dom.style.cursor = 'grab'; };
    dom.addEventListener('pointerdown', down);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    dom.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.cam.radius = Math.max(3.4, Math.min(11, this.cam.radius * (1 + e.deltaY * 0.0009)));
    }, { passive: false });
  }

  initScene() {
    if (this._three) return;
    const THREE = window.THREE;
    const el = this.mountEl;
    if (!el) return;
    let w = el.clientWidth || 700, h = el.clientHeight || 460;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    try { renderer.outputEncoding = THREE.sRGBEncoding; } catch (e) {}
    el.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.42));
    const key = new THREE.DirectionalLight(0xfff1d6, 0.72);
    key.position.set(-4.5, 7.5, 4);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 1; key.shadow.camera.far = 26;
    key.shadow.camera.left = -6; key.shadow.camera.right = 6; key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
    key.shadow.bias = -0.0004;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xfff0d0, 0.22);
    fill.position.set(5, 3, -4);
    scene.add(fill);

    this._three = { THREE, scene, camera, renderer, el };
    this.buildPiece();
    this.updateCamera();
    this.bindControls(renderer.domElement);

    this._onResize = () => {
      const W = el.clientWidth, H = el.clientHeight;
      if (!W || !H) return;
      camera.aspect = W / H; camera.updateProjectionMatrix(); renderer.setSize(W, H);
    };
    window.addEventListener('resize', this._onResize);
    setTimeout(this._onResize, 60);

    const tick = () => {
      if (!this._mounted) return;
      this._raf = requestAnimationFrame(tick);
      if (this.props.autoRotate !== false && !this.drag) this.cam.theta += 0.0035;
      this.updateCamera();
      renderer.render(scene, camera);
    };
    tick();
  }

  disposeGroup(g) {
    g.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { Array.isArray(o.material) ? o.material.forEach((m) => m.dispose()) : o.material.dispose(); }
    });
  }

  makeAbdomenTexture() {
    const THREE = window.THREE;
    const cv = document.createElement('canvas');
    cv.width = 96; cv.height = 512;
    const x = cv.getContext('2d');
    // bold alternating bands: amber and dark brown roughly equal, rear half darker (per photos)
    const amber = '#b3791f';
    const dark = '#241606';
    const yToV = (v) => (1 - v) * 512;
    // amber base
    x.fillStyle = amber; x.fillRect(0, 0, 96, 512);
    // wide dark bands with soft (fuzzy) edges, getting wider/darker toward the tail
    const band = (vTop, vBot) => {
      const yT = yToV(vTop), yB = yToV(vBot), h = yB - yT, fuzz = 10;
      const gg = x.createLinearGradient(0, yT - fuzz, 0, yB + fuzz);
      gg.addColorStop(0, 'rgba(36,22,6,0)');
      gg.addColorStop(fuzz / (h + 2 * fuzz), dark);
      gg.addColorStop(1 - fuzz / (h + 2 * fuzz), dark);
      gg.addColorStop(1, 'rgba(36,22,6,0)');
      x.fillStyle = gg; x.fillRect(0, yT - fuzz, 96, h + 2 * fuzz);
    };
    band(0.86, 0.74); band(0.66, 0.52); band(0.44, 0.28);
    // rear/tail predominantly dark
    x.fillStyle = dark; x.fillRect(0, yToV(0.2), 96, 512 - yToV(0.2));
    const t = new THREE.CanvasTexture(cv);
    t.anisotropy = 4;
    try { t.colorSpace = THREE.SRGBColorSpace; } catch (e) { try { t.encoding = THREE.sRGBEncoding; } catch (e2) {} }
    return t;
  }

  makeWingTexture() {
    const THREE = window.THREE;
    const cv = document.createElement('canvas');
    cv.width = 256; cv.height = 160;
    const x = cv.getContext('2d');
    x.clearRect(0, 0, 256, 160);
    // faint warm amber membrane
    x.fillStyle = 'rgba(214,184,130,0.22)';
    x.beginPath(); x.ellipse(128, 80, 126, 78, 0, 0, Math.PI * 2); x.fill();
    // brown leading edge
    x.strokeStyle = 'rgba(120,80,40,0.6)'; x.lineWidth = 3;
    x.beginPath(); x.ellipse(128, 80, 122, 74, 0, Math.PI * 1.05, Math.PI * 1.95); x.stroke();
    // brown veins fanning from the root
    x.strokeStyle = 'rgba(110,72,36,0.5)'; x.lineWidth = 1.4;
    [30, 60, 80, 100, 130].forEach((ty) => {
      x.beginPath(); x.moveTo(18, 80);
      x.quadraticCurveTo(130, (80 + ty) / 2, 238, ty); x.stroke();
    });
    x.lineWidth = 1;
    x.beginPath(); x.moveTo(150, 45); x.lineTo(158, 120); x.stroke();
    x.beginPath(); x.moveTo(95, 50); x.lineTo(100, 116); x.stroke();
    const t = new THREE.CanvasTexture(cv);
    t.anisotropy = 4;
    try { t.colorSpace = THREE.SRGBColorSpace; } catch (e) {}
    return t;
  }

  buildPiece() {
    const { THREE, scene } = this._three;
    if (this._piece) { scene.remove(this._piece); this.disposeGroup(this._piece); this._piece = null; }
    const faction = this.props.faction || 'brown';
    const queen = !!this.props.queen;
    const discColor = faction === 'gold' ? 0xd2a230 : 0x542514;
    const Y = (a) => new THREE.Vector3(0, 1, 0);
    const ax = new THREE.Vector3(0, 1, 0);

    const g = new THREE.Group();

    const disc = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.6, 72), new THREE.MeshStandardMaterial({ color: discColor, roughness: 0.82 }));
    disc.castShadow = true; disc.receiveShadow = true;
    g.add(disc);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(1.93, 0.09, 14, 80), new THREE.MeshStandardMaterial({ color: discColor, roughness: 0.7 }));
    rim.rotation.x = Math.PI / 2; rim.position.y = 0.3; g.add(rim);

    // warm honeybee palette (per reference photos): fuzzy golden-brown thorax, dark shiny legs
    const golden = new THREE.MeshStandardMaterial({ color: 0x7d5419, roughness: 1 });
    const goldenHead = new THREE.MeshStandardMaterial({ color: 0x744d18, roughness: 1 });
    const darkLeg = new THREE.MeshStandardMaterial({ color: 0x241810, roughness: 0.45, metalness: 0.15 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0d0a06, roughness: 0.2 });

    const bee = new THREE.Group();
    bee.position.y = 0.72; // body stands on its legs, feet resting on the disc surface

    // THORAX
    const thoraxGeo = new THREE.SphereGeometry(1, 40, 32);
    {
      const p = thoraxGeo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const vx = p.getX(i), vy = p.getY(i), vz = p.getZ(i);
        const n = 1 + 0.05 * Math.sin(vx * 9) * Math.cos(vz * 8) + 0.04 * Math.sin(vy * 11);
        p.setXYZ(i, vx * n, vy * n, vz * n);
      }
      thoraxGeo.computeVertexNormals();
    }
    const thoraxR = { x: 0.62, y: 0.6, z: 0.66 };
    const thoraxC = new THREE.Vector3(0, 0.2, 0.42);
    const thorax = new THREE.Mesh(thoraxGeo, golden);
    thorax.scale.set(thoraxR.x, thoraxR.y, thoraxR.z);
    thorax.position.copy(thoraxC); thorax.castShadow = true;
    bee.add(thorax);

    // WAIST
    const waist = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.26, 0.22, 16), golden);
    waist.rotation.x = Math.PI / 2; waist.position.set(0, 0.16, -0.05);
    bee.add(waist);

    // ABDOMEN (tapered, striped)
    const abGeo = new THREE.SphereGeometry(1, 56, 40);
    abGeo.rotateX(Math.PI / 2);
    {
      const p = abGeo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const zn = p.getZ(i);
        let f = zn < 0 ? Math.max(0.25, 1 + 0.55 * zn) : 1 - 0.12 * zn;
        p.setX(i, p.getX(i) * f); p.setY(i, p.getY(i) * f);
        if (zn < 0) p.setZ(i, zn * 1.2);
      }
      abGeo.computeVertexNormals();
    }
    const abdomen = new THREE.Mesh(abGeo, new THREE.MeshStandardMaterial({ map: this.makeAbdomenTexture(), roughness: 0.5 }));
    abdomen.scale.set(0.56, 0.54, 0.95);
    abdomen.position.set(0, 0.14, -0.78); abdomen.castShadow = true;
    bee.add(abdomen);

    // HEAD
    const headC = new THREE.Vector3(0, 0.22, 1.12);
    const headR = { x: 0.42, y: 0.44, z: 0.38 };
    const head = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 26), goldenHead);
    head.scale.set(headR.x, headR.y, headR.z); head.position.copy(headC); head.castShadow = true;
    bee.add(head);

    // COMPOUND EYES
    [-1, 1].forEach((s) => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 22), eyeMat);
      eye.scale.set(0.2, 0.3, 0.26);
      eye.position.set(s * 0.34, 0.26, 1.16);
      bee.add(eye);
    });

    // ELBOWED ANTENNAE: out the front of the face, forward & slightly up, then elbow forward-and-DOWN
    [-1, 1].forEach((s) => {
      const base = new THREE.Vector3(s * 0.12, 0.3, 1.44);
      const d1 = new THREE.Vector3(s * 0.3, 0.22, 1).normalize();
      const l1 = 0.26;
      const elbow = base.clone().addScaledVector(d1, l1);
      const seg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.032, l1, 10), darkLeg);
      seg1.position.copy(base.clone().addScaledVector(d1, l1 / 2));
      seg1.quaternion.setFromUnitVectors(ax, d1);
      bee.add(seg1);
      const d2 = new THREE.Vector3(s * 0.14, -0.18, 0.97).normalize();
      const l2 = 0.34;
      const seg2 = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.028, l2, 10), darkLeg);
      seg2.position.copy(elbow.clone().addScaledVector(d2, l2 / 2));
      seg2.quaternion.setFromUnitVectors(ax, d2);
      bee.add(seg2);
      const tip = new THREE.Mesh(new THREE.SphereGeometry(0.034, 12, 12), darkLeg);
      tip.position.copy(elbow.clone().addScaledVector(d2, l2));
      bee.add(tip);
    });

    // SIX LEGS
    const segLeg = (a, b, r0, r1) => {
      const d = b.clone().sub(a); const len = d.length();
      const m = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, len, 8), darkLeg);
      m.position.copy(a.clone().add(b).multiplyScalar(0.5));
      m.quaternion.setFromUnitVectors(ax, d.normalize());
      bee.add(m);
    };
    // feet land at local y = -0.42 (= disc surface, since bee group sits at y=0.72)
    [0.62, 0.2, -0.2].forEach((lz, idx) => {
      [-1, 1].forEach((s) => {
        const hip = new THREE.Vector3(s * 0.4, -0.02, lz);
        const out = 0.4 + idx * 0.04;
        const knee = new THREE.Vector3(s * (0.4 + out), -0.24, lz + (idx === 0 ? 0.16 : idx === 2 ? -0.16 : 0));
        const foot = new THREE.Vector3(knee.x + s * 0.08, -0.42, knee.z + (idx === 0 ? 0.26 : idx === 2 ? -0.26 : 0));
        segLeg(hip, knee, 0.03, 0.04);
        segLeg(knee, foot, 0.02, 0.025);
      });
    });

    // WINGS — two pairs of veined translucent membranes, swept back
    const wingMat = new THREE.MeshStandardMaterial({ map: this.makeWingTexture(), color: 0xf0e2c4, transparent: true, opacity: 0.78, roughness: 0.3, side: THREE.DoubleSide, depthWrite: false });
    // root the wings at the top of the thorax and sweep them BACK over the abdomen (toward -z), tilted up
    const addWing = (root, dir, length, halfW) => {
      [-1, 1].forEach((s) => {
        const wing = new THREE.Mesh(new THREE.CircleGeometry(1, 40), wingMat);
        wing.geometry.translate(1, 0, 0); // root at mesh origin, membrane extends +x
        wing.scale.set(length, halfW, 1);
        wing.position.set(s * root.x, root.y, root.z);
        const d = new THREE.Vector3(s * dir.x, dir.y, dir.z).normalize();
        wing.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), d);
        bee.add(wing);
      });
    };
    addWing({ x: 0.12, y: 0.82, z: 0.32 }, { x: 0.34, y: 0.12, z: -0.93 }, 1.05, 0.36);  // forewings (larger)
    addWing({ x: 0.14, y: 0.78, z: 0.2 }, { x: 0.46, y: 0.05, z: -0.89 }, 0.7, 0.26);    // hindwings (smaller)

    g.add(bee);

    // QUEEN: crown band + spikes inside the rim + red disc ring
    if (queen) {
      const gmat = new THREE.MeshStandardMaterial({ color: 0xffd24a, roughness: 0.32, metalness: 0.55 });
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.3, 0.16, 18), gmat);
      band.position.set(0, 0.62, 1.12); bee.add(band);
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const sp = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.14, 8), gmat);
        sp.position.set(Math.sin(a) * 0.17, 0.74, 1.12 + Math.cos(a) * 0.17);
        bee.add(sp);
      }
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.78, 0.05, 12, 90), new THREE.MeshStandardMaterial({ color: 0xcf2a1c, roughness: 0.5 }));
      ring.rotation.x = Math.PI / 2; ring.position.y = 0.32; g.add(ring);
    }

    this._piece = g;
    scene.add(g);
  }
}
</script>
</body>
</html>
