<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>html,body{margin:0;height:100%}</style>
  <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
</helmet>
<div style="width:100%; height:100vh; min-height:480px; background:#ece6da; display:flex; flex-direction:column; font-family:'Poppins',system-ui,sans-serif;">
  <div style="padding:14px 22px; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap;">
    <div style="font-size:18px; font-weight:700; letter-spacing:-0.01em; color:#3a2410;">Be the Bee — 3D 말</div>
    <div style="font-size:12px; color:#9a6b34; letter-spacing:0.03em;">드래그로 회전 · 스크롤로 확대 · 우측 Tweaks에서 진영·여왕벌 전환</div>
  </div>
  <div ref="{{ setMount }}" style="flex:1; min-height:0; width:100%;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:520},&quot;faction&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;brown&quot;,&quot;gold&quot;],&quot;default&quot;:&quot;brown&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;queen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;autoRotate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    this._setMount = this._setMount || ((el) => { this.mountEl = el; });
    return { setMount: this._setMount };
  }

  componentDidMount() {
    this._mounted = true;
    this.cam = { radius: 6.6, theta: 0.62, phi: 0.74 };
    this.target = { x: 0, y: 0.55, z: 0 };
    this.drag = null;
    this.waitForThree(() => this.initScene());
  }
  componentWillUnmount() {
    this._mounted = false;
    if (this._raf) cancelAnimationFrame(this._raf);
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    if (this._three && this._three.renderer) this._three.renderer.dispose();
  }
  componentDidUpdate(prev) {
    if (this._three && (prev.faction !== this.props.faction || prev.queen !== this.props.queen)) this.buildPiece();
  }

  waitForThree(cb, n) {
    n = n || 0;
    if (window.THREE) return cb();
    if (n > 240) { console.error('three.js load timeout'); return; }
    setTimeout(() => this.waitForThree(cb, n + 1), 50);
  }

  updateCamera() {
    const c = this.cam, t = this.target, cam = this._three.camera;
    const x = t.x + c.radius * Math.sin(c.phi) * Math.sin(c.theta);
    const y = t.y + c.radius * Math.cos(c.phi);
    const z = t.z + c.radius * Math.sin(c.phi) * Math.cos(c.theta);
    cam.position.set(x, y, z);
    cam.lookAt(t.x, t.y, t.z);
  }

  bindControls(dom) {
    dom.style.touchAction = 'none';
    dom.style.cursor = 'grab';
    const down = (e) => { this.drag = { x: e.clientX, y: e.clientY }; dom.style.cursor = 'grabbing'; };
    const move = (e) => {
      if (!this.drag) return;
      const dx = e.clientX - this.drag.x, dy = e.clientY - this.drag.y;
      this.drag = { x: e.clientX, y: e.clientY };
      this.cam.theta -= dx * 0.008;
      this.cam.phi = Math.max(0.16, Math.min(1.46, this.cam.phi - dy * 0.008));
    };
    const up = () => { this.drag = null; dom.style.cursor = 'grab'; };
    dom.addEventListener('pointerdown', down);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    dom.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.cam.radius = Math.max(3.4, Math.min(11, this.cam.radius * (1 + e.deltaY * 0.0009)));
    }, { passive: false });
  }

  initScene() {
    if (this._three) return;
    const THREE = window.THREE;
    const el = this.mountEl;
    if (!el) return;
    let w = el.clientWidth || 700, h = el.clientHeight || 460;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    try { renderer.outputEncoding = THREE.sRGBEncoding; } catch (e) {}
    el.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xfff1d6, 1.2);
    key.position.set(-4.5, 7.5, 4);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 1; key.shadow.camera.far = 26;
    key.shadow.camera.left = -6; key.shadow.camera.right = 6; key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
    key.shadow.bias = -0.0004;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xc4d6ff, 0.35);
    fill.position.set(5, 3, -4);
    scene.add(fill);

    this._three = { THREE, scene, camera, renderer, el };
    this.buildPiece();
    this.updateCamera();
    this.bindControls(renderer.domElement);

    this._onResize = () => {
      const W = el.clientWidth, H = el.clientHeight;
      if (!W || !H) return;
      camera.aspect = W / H; camera.updateProjectionMatrix(); renderer.setSize(W, H);
    };
    window.addEventListener('resize', this._onResize);
    setTimeout(this._onResize, 60);

    const tick = () => {
      if (!this._mounted) return;
      this._raf = requestAnimationFrame(tick);
      if (this.props.autoRotate !== false && !this.drag) this.cam.theta += 0.0035;
      this.updateCamera();
      renderer.render(scene, camera);
    };
    tick();
  }

  disposeGroup(g) {
    g.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { Array.isArray(o.material) ? o.material.forEach((m) => m.dispose()) : o.material.dispose(); }
    });
  }

  makeBodyTexture() {
    const THREE = window.THREE;
    const w = 64, h = 512;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const x = cv.getContext('2d');
    x.fillStyle = '#f4b70e'; x.fillRect(0, 0, w, h);
    const black = '#1d150b';
    const yToV = (v) => (1 - v) * h; // v=1 (head pole) at top of canvas, v=0 (tail) at bottom
    // solid black tail painted on the body (flat, no relief) — bottom ~28%
    x.fillStyle = black; x.fillRect(0, yToV(0.28), w, h - yToV(0.28));
    // two thick painted stripes, spaced so yellow shows between them
    const band = (v, th) => { x.fillStyle = black; x.fillRect(0, yToV(v) - th / 2, w, th); };
    band(0.63, 48); band(0.45, 48);
    const t = new THREE.CanvasTexture(cv);
    t.anisotropy = 4;
    t.wrapS = THREE.RepeatWrapping;
    try { t.colorSpace = THREE.SRGBColorSpace; } catch (e) { try { t.encoding = THREE.sRGBEncoding; } catch (e2) {} }
    return t;
  }

  buildPiece() {
    const { THREE, scene } = this._three;
    if (this._piece) { scene.remove(this._piece); this.disposeGroup(this._piece); this._piece = null; }
    const faction = this.props.faction || 'brown';
    const queen = !!this.props.queen;
    const discColor = faction === 'gold' ? 0xd2a230 : 0x542514;

    const g = new THREE.Group();

    // disc (taller so the bee can sink ~30% into it)
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.6, 72), new THREE.MeshStandardMaterial({ color: discColor, roughness: 0.82 }));
    disc.castShadow = true; disc.receiveShadow = true;
    g.add(disc);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(1.93, 0.09, 14, 80), new THREE.MeshStandardMaterial({ color: discColor, roughness: 0.7 }));
    rim.rotation.x = Math.PI / 2; rim.position.y = 0.3; g.add(rim);

    const yellow = new THREE.MeshStandardMaterial({ color: 0xf4b70e, roughness: 0.5 });
    const black = new THREE.MeshStandardMaterial({ color: 0x1d150b, roughness: 0.55 });
    const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });

    // Solid-of-revolution of the SVG bee: circular cross-section, long axis = z (head +z, tail -z).
    // SVG->3D scale = 2/80. body rx32 -> R=0.8, ry46 -> L=1.15. Embedded so 30% of the body
    // diameter sits below the disc top surface (disc top y=0.3, group y=0.62, body bottom y=-0.18).
    const R = 0.8, L = 1.15;
    const bodyR = (z) => R * Math.sqrt(Math.max(0.02, 1 - Math.pow(z / L, 2)));
    const bee = new THREE.Group();
    bee.position.y = 0.62;

    // body with painted-on stripes + tail (flat canvas texture, no relief). Poles on the z axis.
    const bodyGeo = new THREE.SphereGeometry(1, 64, 48);
    bodyGeo.rotateX(Math.PI / 2);
    const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ map: this.makeBodyTexture(), roughness: 0.5 }));
    body.scale.set(R, R, L); body.castShadow = true; bee.add(body);

    // head (SVG rx20.5->0.51, ry17.5->0.44, offset 46 -> z+1.0)
    const head = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 30), black);
    head.scale.set(0.55, 0.55, 0.5); head.position.set(0, 0.24, 0.98);
    head.castShadow = true; bee.add(head);
    // small cute eyes on the front of the head (bright white + dark pupil so they read in shadow)
    // eyes sit ON the front surface of the head (head center 0,0.24,0.98 · radii 0.55,0.55,0.5),
    // pushed outward so they poke out instead of being buried inside the black sphere.
    // flat cartoon eyes painted on the head: black rim + white + big dark iris + highlight,
    // as a stack of flat discs, the group scaled to a slightly tall oval (cute).
    const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, emissive: 0x444444, side: THREE.DoubleSide });
    const eyeDark = new THREE.MeshStandardMaterial({ color: 0x15100a, side: THREE.DoubleSide });
    const zAxis = new THREE.Vector3(0, 0, 1);
    const C = new THREE.Vector3(0, 0.24, 0.98), rxh = 0.55, ryh = 0.55, rzh = 0.5;
    [-1, 1].forEach((s) => {
      const u = new THREE.Vector3(s * 0.33, 0.33, 0.86).normalize();
      const P = new THREE.Vector3(C.x + rxh * u.x, C.y + ryh * u.y, C.z + rzh * u.z);
      const nrm = new THREE.Vector3(u.x / rxh, u.y / ryh, u.z / rzh).normalize();
      const eye = new THREE.Group();
      eye.position.copy(P);
      eye.quaternion.setFromUnitVectors(zAxis, nrm);
      eye.scale.set(0.78, 1, 1); // vertically elongated oval
      const rim = new THREE.Mesh(new THREE.CircleGeometry(0.144, 30), eyeDark); rim.position.z = 0.002; eye.add(rim);
      const wht = new THREE.Mesh(new THREE.CircleGeometry(0.123, 30), eyeWhite); wht.position.z = 0.006; eye.add(wht);
      const iris = new THREE.Mesh(new THREE.CircleGeometry(0.075, 26), eyeDark); iris.position.set(0, -0.005, 0.01); eye.add(iris);
      const hi = new THREE.Mesh(new THREE.CircleGeometry(0.025, 18), eyeWhite); hi.position.set(0.02, 0.038, 0.014); eye.add(hi);
      bee.add(eye);
    });
    // antennae — stem oriented along its true direction, knob fixed to the stem tip
    const up = new THREE.Vector3(0, 1, 0);
    [-1, 1].forEach((s) => {
      const base = new THREE.Vector3(s * 0.14, 0.62, 1.06);
      const dir = new THREE.Vector3(s * 0.45, 1.0, 0.5).normalize();
      const len = 0.42;
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, len, 12), black);
      stem.position.copy(base.clone().addScaledVector(dir, len / 2));
      stem.quaternion.setFromUnitVectors(up, dir);
      bee.add(stem);
      const knob = new THREE.Mesh(new THREE.SphereGeometry(0.062, 16, 16), black);
      knob.position.copy(base.clone().addScaledVector(dir, len));
      bee.add(knob);
    });

    // wings: roots gather at the head-shoulder (+z), sweeping back-out toward the tail
    const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.42, roughness: 0.2, side: THREE.DoubleSide, depthWrite: false });
    [-1, 1].forEach((s) => {
      const wing = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 18), wingMat);
      wing.scale.set(0.46, 0.05, 0.95);
      const root = new THREE.Vector3(s * 0.18, 0.6, 0.46);           // gather at the head/shoulder
      const tip = new THREE.Vector3(s * 1.02, 0.48, -0.66);          // spread out and back toward the tail
      const mid = root.clone().add(tip).multiplyScalar(0.5);
      wing.position.copy(mid);
      wing.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tip.clone().sub(root).normalize());
      bee.add(wing);
    });

    g.add(bee);

    if (queen) {
      const gold = new THREE.MeshStandardMaterial({ color: 0xffd24a, roughness: 0.32, metalness: 0.55 });
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.29, 0.16, 16), gold);
      band.position.set(0, 0.82, 0.98); bee.add(band);
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        const sp = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.12, 8), gold);
        sp.position.set(Math.sin(a) * 0.17, 0.94, 0.98 + Math.cos(a) * 0.17);
        bee.add(sp);
      }
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.78, 0.05, 12, 90), new THREE.MeshStandardMaterial({ color: 0xcf2a1c, roughness: 0.5 }));
      ring.rotation.x = Math.PI / 2; ring.position.y = 0.31; g.add(ring);
    }

    this._piece = g;
    scene.add(g);
  }
}
</script>
</body>
</html>
