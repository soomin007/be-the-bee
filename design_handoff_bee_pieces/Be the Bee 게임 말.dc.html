<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-width:100%; min-height:100vh; box-sizing:border-box; padding:56px 48px 72px; background: {{ bg }}; font-family: 'Poppins', 'Pretendard', system-ui, sans-serif;">
  <div style="max-width:1040px; margin:0 auto;">

    <div style="display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:6px;">
      <div style="font-size:30px; font-weight:700; letter-spacing:-0.01em; color:#3a2410;">Be the Bee — 게임 말</div>
      <div style="font-size:14px; font-weight:500; color:#9a6b34; letter-spacing:0.04em;">실물 디자인 → SVG 에셋</div>
    </div>
    <div style="font-size:14px; line-height:1.5; color:#7a5a3a; max-width:560px; margin-bottom:40px;">갈색·노랑 두 진영, 같은 꿀벌. 디스크 색으로 진영을 구분하고 검은 머리·줄무늬·은빛 띠로 가독성을 유지합니다.</div>

    <div style="font-size:12px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#a07a4a; margin-bottom:18px;">기본 말</div>
    <div style="display:flex; gap:32px; align-items:flex-start; flex-wrap:wrap; margin-bottom:48px;">

      <div style="flex:none;">
        <div style="font-size:13px; font-weight:600; color:#5a3f22; margin-bottom:10px;">갈색 진영</div>
        <div style="width:268px; height:268px; background:#fbf8f2; border-radius:6px; box-shadow:0 1px 3px rgba(60,40,20,0.12); padding:14px; box-sizing:border-box;">
          <dc-import name="BeePiece" disc-top="#6f3529" disc-side="#3f1f17" disc-rim="#9a5847" piece-style="{{ pieceStyle }}" tilt="{{ tilt }}" queen="{{ false }}" hint-size="240px,252px"></dc-import>
        </div>
      </div>

      <div style="flex:none;">
        <div style="font-size:13px; font-weight:600; color:#5a3f22; margin-bottom:10px;">노랑 진영</div>
        <div style="width:268px; height:268px; background:#fbf8f2; border-radius:6px; box-shadow:0 1px 3px rgba(60,40,20,0.12); padding:14px; box-sizing:border-box;">
          <dc-import name="BeePiece" disc-top="#d2a230" disc-side="#967216" disc-rim="#ecc659" piece-style="{{ pieceStyle }}" tilt="{{ tilt }}" queen="{{ false }}" hint-size="240px,252px"></dc-import>
        </div>
      </div>

    </div>

    <div style="font-size:12px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:#a07a4a; margin-bottom:18px;">여왕벌 ♛</div>
    <div style="display:flex; gap:32px; align-items:flex-start; flex-wrap:wrap;">

      <div style="flex:none;">
        <div style="font-size:13px; font-weight:600; color:#5a3f22; margin-bottom:10px;">갈색 여왕벌</div>
        <div style="width:268px; height:268px; background:#fbf8f2; border-radius:6px; box-shadow:0 1px 3px rgba(60,40,20,0.12); padding:14px; box-sizing:border-box;">
          <dc-import name="BeePiece" disc-top="#6f3529" disc-side="#3f1f17" disc-rim="#9a5847" ring="#cf2a1c" piece-style="{{ pieceStyle }}" tilt="{{ tilt }}" queen="{{ true }}" hint-size="240px,252px"></dc-import>
        </div>
      </div>

      <div style="flex:none;">
        <div style="font-size:13px; font-weight:600; color:#5a3f22; margin-bottom:10px;">노랑 여왕벌</div>
        <div style="width:268px; height:268px; background:#fbf8f2; border-radius:6px; box-shadow:0 1px 3px rgba(60,40,20,0.12); padding:14px; box-sizing:border-box;">
          <dc-import name="BeePiece" disc-top="#d2a230" disc-side="#967216" disc-rim="#ecc659" ring="#cf2a1c" piece-style="{{ pieceStyle }}" tilt="{{ tilt }}" queen="{{ true }}" hint-size="240px,252px"></dc-import>
        </div>
      </div>

    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ece6da&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pieceStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;domed&quot;,&quot;matte&quot;],&quot;default&quot;:&quot;matte&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tilt&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;min&quot;:-25,&quot;max&quot;:25,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    return {
      bg: p.bg ?? '#ece6da',
      pieceStyle: p.pieceStyle ?? 'domed',
      tilt: p.tilt ?? 0,
    };
  }
}
</script>
</body>
</html>
