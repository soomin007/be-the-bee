<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 200 210" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block; overflow:visible">
  <defs>
    <radialGradient id="body-{{ uid }}" cx="38%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#ffd456"></stop>
      <stop offset="52%" stop-color="#f4b70e"></stop>
      <stop offset="100%" stop-color="#c8870a"></stop>
    </radialGradient>
    <radialGradient id="disc-{{ uid }}" cx="36%" cy="30%" r="80%">
      <stop offset="0%" stop-color="{{ discLight }}"></stop>
      <stop offset="60%" stop-color="{{ discTop }}"></stop>
      <stop offset="100%" stop-color="{{ discDark }}"></stop>
    </radialGradient>
    <clipPath id="bodyclip-{{ uid }}"><ellipse cx="100" cy="111" rx="32" ry="46"></ellipse></clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="122" rx="80" ry="68" fill="#000000" opacity="0.16"></ellipse>
  <!-- disc thickness (side) -->
  <circle cx="100" cy="109" r="80" fill="{{ discSide }}"></circle>
  <!-- disc top face -->
  <circle cx="100" cy="100" r="80" fill="url(#disc-{{ uid }})"></circle>
  <!-- inner rim highlight -->
  <circle cx="100" cy="100" r="79" fill="none" stroke="{{ discRim }}" stroke-width="2.2" opacity="0.5"></circle>
  <!-- soft top-left sheen -->
  <ellipse cx="74" cy="72" rx="44" ry="31" fill="#ffffff" opacity="{{ glossOpDisc }}"></ellipse>
  <!-- accent ring (special marker), inset from the disc edge -->
  <circle cx="100" cy="100" r="71" fill="none" stroke="{{ ringColor }}" stroke-width="2.8" style="display: {{ ringDisplay }}"></circle>

  <g transform="rotate({{ tilt }} 100 100)">
    <!-- stubby antennae (roots tucked under the head) -->
    <path d="M94 53 Q88 44 84 41" fill="none" stroke="#15100a" stroke-width="3.6" stroke-linecap="round"></path>
    <path d="M106 53 Q112 44 116 41" fill="none" stroke="#15100a" stroke-width="3.6" stroke-linecap="round"></path>
    <circle cx="83" cy="40" r="3.4" fill="#15100a"></circle>
    <circle cx="117" cy="40" r="3.4" fill="#15100a"></circle>

    <!-- body -->
    <ellipse cx="100" cy="111" rx="32" ry="46" fill="url(#body-{{ uid }})" stroke="#9a6406" stroke-width="1.6"></ellipse>
    <!-- stripes + solid black tail, wrapping the body (clipped to its silhouette) -->
    <g clip-path="url(#bodyclip-{{ uid }})">
      <path d="M26 100 Q100 109 174 100" fill="none" stroke="#1d150b" stroke-width="11"></path>
      <path d="M28 119 Q100 128 172 119" fill="none" stroke="#1d150b" stroke-width="11"></path>
      <path d="M56 162 L56 129 Q100 138 144 129 L144 162 Z" fill="#1d150b"></path>
    </g>
    <!-- body sheen highlight -->
    <ellipse cx="86" cy="92" rx="10" ry="15" fill="#ffffff" opacity="{{ glossOp }}"></ellipse>

    <!-- wings: rooted at the yellow shoulder, sweeping back-out at ~45 deg -->
    <ellipse cx="73" cy="105" rx="29" ry="12" fill="#fbfaf6" opacity="0.82" stroke="#d8c79a" stroke-width="1.4" transform="rotate(-40 73 105)"></ellipse>
    <ellipse cx="127" cy="105" rx="29" ry="12" fill="#fbfaf6" opacity="0.82" stroke="#d8c79a" stroke-width="1.4" transform="rotate(40 127 105)"></ellipse>
    <path d="M95 88 Q75 101 53 120" fill="none" stroke="#cdb988" stroke-width="1" opacity="0.6"></path>
    <path d="M105 88 Q125 101 147 120" fill="none" stroke="#cdb988" stroke-width="1" opacity="0.6"></path>

    <!-- head -->
    <ellipse cx="100" cy="65" rx="20.5" ry="17.5" fill="#15100a"></ellipse>
    <ellipse cx="93" cy="58" rx="7" ry="5" fill="#ffffff" opacity="0.14"></ellipse>
    <!-- eyes -->
    <circle cx="91" cy="59" r="3.9" fill="#ffffff"></circle>
    <circle cx="109" cy="59" r="3.9" fill="#ffffff"></circle>

    <!-- queen crown -->
    <text x="100" y="44" text-anchor="middle" dominant-baseline="central" font-size="30" fill="#ffe07a" stroke="#7a5410" stroke-width="0.6" style="display: {{ crownDisplay }}">♛</text>
  </g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:252},&quot;discTop&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#6f3529&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;discLight&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;discDark&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;discSide&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3f1f17&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;discRim&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#9a5847&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ring&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pieceStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;domed&quot;,&quot;matte&quot;],&quot;default&quot;:&quot;domed&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tilt&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:0,&quot;min&quot;:-30,&quot;max&quot;:30,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;queen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const matte = (p.pieceStyle ?? 'domed') === 'matte';
    this._uid = this._uid || ('b' + Math.random().toString(36).slice(2, 8));
    const top = p.discTop ?? '#6f3529';
    const ring = p.ring ?? '';
    return {
      uid: this._uid,
      ringColor: ring || '#cf2a1c',
      ringDisplay: ring ? 'inline' : 'none',
      discTop: top,
      discLight: p.discLight ?? this.lighten(top, 0.22),
      discDark: p.discDark ?? this.lighten(top, -0.28),
      discSide: p.discSide ?? '#3f1f17',
      discRim: p.discRim ?? '#9a5847',
      tilt: p.tilt ?? 0,
      glossOp: matte ? 0 : 0.42,
      glossOpDisc: matte ? 0 : 0.06,
      crownDisplay: p.queen ? 'inline' : 'none',
    };
  }
  lighten(hex, amt) {
    const h = hex.replace('#', '');
    let r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    const f = (c) => Math.max(0, Math.min(255, Math.round(amt >= 0 ? c + (255 - c) * amt : c * (1 + amt))));
    return '#' + [f(r), f(g), f(b)].map((c) => c.toString(16).padStart(2, '0')).join('');
  }
}
</script>
</body>
</html>
