<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Be the Bee — 3D 보드 미리보기(읽기 전용)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, #fbf3de, #efe0bd);
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        color: #6e5114;
        background: #fff8e6cc;
        border: 1px solid #e3cf9c;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 14px;
      }
      #nav {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
      }
      #nav a {
        color: #6e5114;
        text-decoration: none;
        background: #fff8e6cc;
        border: 1px solid #e3cf9c;
        border-radius: 999px;
        padding: 6px 14px;
        margin: 0 4px;
      }
      #nav a.on {
        background: #6e5114;
        color: #fff8e6;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #8a3b1d;
        padding: 24px;
      }
    </style>
    <!-- 1단계(읽기 전용 3D 보드 평가). 게임 엔진/게임 UI 와 분리된 정적 데모 — game-ui.ts 안 건드림.
         실제 게임처럼 연결된 헥스 보드(타일+말)를 three.js 로 렌더만 한다(입력·오버레이 일부는 다음 단계). -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0",
          "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="nav"><a href="three-demo.html">① 스타일 토큰</a><a href="three-demo-real.html">② 현실 벌</a><a href="board3d-demo.html" class="on">③ 보드 미리보기</a></div>
    <div id="hint">드래그로 회전 · 휠로 확대 — 3D 보드 읽기 전용 미리보기(입력·오버레이 일부는 다음 단계)</div>
    <div id="err">three.js 를 CDN 에서 불러오지 못했어요. 인터넷 연결을 확인하세요.</div>
    <script type="module">
      try {
        const THREE = await import('three')
        const { OrbitControls } = await import('three/addons/controls/OrbitControls.js')

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200)
        camera.position.set(2.5, 9, 9.5)

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
        renderer.setSize(innerWidth, innerHeight)
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
        renderer.shadowMap.enabled = true
        renderer.shadowMap.type = THREE.PCFSoftShadowMap
        document.body.appendChild(renderer.domElement)

        scene.add(new THREE.AmbientLight(0xfff4d8, 0.8))
        const key = new THREE.DirectionalLight(0xfff1c0, 1.25)
        key.position.set(-6, 12, 6)
        key.castShadow = true
        key.shadow.mapSize.set(2048, 2048)
        key.shadow.camera.near = 1
        key.shadow.camera.far = 40
        key.shadow.camera.left = -10
        key.shadow.camera.right = 10
        key.shadow.camera.top = 10
        key.shadow.camera.bottom = -10
        scene.add(key)
        const fill = new THREE.DirectionalLight(0xffffff, 0.32)
        fill.position.set(7, 4, -5)
        scene.add(fill)

        const ground = new THREE.Mesh(new THREE.CircleGeometry(22, 48), new THREE.ShadowMaterial({ opacity: 0.16 }))
        ground.rotation.x = -Math.PI / 2
        ground.position.y = -0.001
        ground.receiveShadow = true
        scene.add(ground)

        const mat = (c, rough = 0.6) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0.04 })

        // ---- 헥스 타일(pointy-top, 엔진 layout.ts 와 동일 배치) ----
        const TILE = { yellow: 0xf0c531, brown: 0x97581d }
        const TILE_SIZE = 1.0 // 헥스 외접원 반지름(엔진 HEX_SIZE 대응)
        function hexTile(owner, isHive) {
          const m = isHive
            ? new THREE.MeshStandardMaterial({ color: TILE[owner], roughness: 0.6, emissive: 0xf59e0b, emissiveIntensity: 0.35 })
            : mat(TILE[owner], 0.7)
          // 회전 없음 = pointy-top: CylinderGeometry(6) 기본 꼭짓점이 ±z 라 엔진 layout(pointy-top)과
          // 그대로 맞물린다. (이전에 rotate(π/6)을 줘서 flat-top 이 돼 가로 폭이 간격보다 커져 겹쳤음.)
          // 메시만 살짝 줄여(0.98) 얇은 틈 + 면 겹침(z-fighting) 방지.
          const tile = new THREE.Mesh(new THREE.CylinderGeometry(TILE_SIZE * 0.98, TILE_SIZE * 0.98, 0.22, 6), m)
          tile.position.y = 0.11 // 윗면 y=0.22 (스타일 토큰 데모와 같은 두께 → 말이 떠 보이지 않게)
          tile.castShadow = tile.receiveShadow = true
          return tile
        }
        // q,r → 3D(XZ): 엔진 hexToPixel(pointy-top)와 동일 식, y→z
        function hexToXZ(q, r) {
          return { x: TILE_SIZE * (Math.sqrt(3) * q + (Math.sqrt(3) / 2) * r), z: TILE_SIZE * (1.5 * r) }
        }

        // ---- 말(원판+벌) = Claude Design 핸드오프 3D(스타일 토큰), three-demo.html 과 동일 ----
        function makeBodyTexture() {
          const w = 64
          const h = 512
          const cv = document.createElement('canvas')
          cv.width = w
          cv.height = h
          const x = cv.getContext('2d')
          x.fillStyle = '#f4b70e'
          x.fillRect(0, 0, w, h)
          const black = '#1d150b'
          const yToV = (v) => (1 - v) * h
          x.fillStyle = black
          x.fillRect(0, yToV(0.28), w, h - yToV(0.28))
          const band = (v, th) => {
            x.fillStyle = black
            x.fillRect(0, yToV(v) - th / 2, w, th)
          }
          band(0.63, 48)
          band(0.45, 48)
          const t = new THREE.CanvasTexture(cv)
          t.anisotropy = 4
          t.wrapS = THREE.RepeatWrapping
          try {
            t.colorSpace = THREE.SRGBColorSpace
          } catch (e) {}
          return t
        }
        function buildPiece(side, queen) {
          const discColor = side === 'yellow' ? 0xd2a230 : 0x542514
          const g = new THREE.Group()
          const disc = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.6, 72), new THREE.MeshStandardMaterial({ color: discColor, roughness: 0.82 }))
          disc.castShadow = disc.receiveShadow = true
          g.add(disc)
          const rim = new THREE.Mesh(new THREE.TorusGeometry(1.93, 0.09, 14, 80), new THREE.MeshStandardMaterial({ color: discColor, roughness: 0.7 }))
          rim.rotation.x = Math.PI / 2
          rim.position.y = 0.3
          g.add(rim)
          const black = new THREE.MeshStandardMaterial({ color: 0x1d150b, roughness: 0.55 })
          const bee = new THREE.Group()
          bee.position.y = 0.62
          const bodyGeo = new THREE.SphereGeometry(1, 64, 48)
          bodyGeo.rotateX(Math.PI / 2)
          const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ map: makeBodyTexture(), roughness: 0.5 }))
          body.scale.set(0.8, 0.8, 1.15)
          body.castShadow = true
          bee.add(body)
          const head = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 30), black)
          head.scale.set(0.55, 0.55, 0.5)
          head.position.set(0, 0.24, 0.98)
          head.castShadow = true
          bee.add(head)
          const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, emissive: 0x444444, side: THREE.DoubleSide })
          const eyeDark = new THREE.MeshStandardMaterial({ color: 0x15100a, side: THREE.DoubleSide })
          const zAxis = new THREE.Vector3(0, 0, 1)
          const C = new THREE.Vector3(0, 0.24, 0.98)
          const rxh = 0.55
          const ryh = 0.55
          const rzh = 0.5
          for (const s of [-1, 1]) {
            const u = new THREE.Vector3(s * 0.33, 0.33, 0.86).normalize()
            const P = new THREE.Vector3(C.x + rxh * u.x, C.y + ryh * u.y, C.z + rzh * u.z)
            const nrm = new THREE.Vector3(u.x / rxh, u.y / ryh, u.z / rzh).normalize()
            const eye = new THREE.Group()
            eye.position.copy(P)
            eye.quaternion.setFromUnitVectors(zAxis, nrm)
            eye.scale.set(0.78, 1, 1)
            const erim = new THREE.Mesh(new THREE.CircleGeometry(0.144, 30), eyeDark)
            erim.position.z = 0.002
            eye.add(erim)
            const wht = new THREE.Mesh(new THREE.CircleGeometry(0.123, 30), eyeWhite)
            wht.position.z = 0.006
            eye.add(wht)
            const iris = new THREE.Mesh(new THREE.CircleGeometry(0.075, 26), eyeDark)
            iris.position.set(0, -0.005, 0.01)
            eye.add(iris)
            const hi = new THREE.Mesh(new THREE.CircleGeometry(0.025, 18), eyeWhite)
            hi.position.set(0.02, 0.038, 0.014)
            eye.add(hi)
            bee.add(eye)
          }
          const up = new THREE.Vector3(0, 1, 0)
          for (const s of [-1, 1]) {
            const base = new THREE.Vector3(s * 0.14, 0.62, 1.06)
            const dir = new THREE.Vector3(s * 0.45, 1.0, 0.5).normalize()
            const len = 0.42
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, len, 12), black)
            stem.position.copy(base.clone().addScaledVector(dir, len / 2))
            stem.quaternion.setFromUnitVectors(up, dir)
            bee.add(stem)
            const knob = new THREE.Mesh(new THREE.SphereGeometry(0.062, 16, 16), black)
            knob.position.copy(base.clone().addScaledVector(dir, len))
            bee.add(knob)
          }
          const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.42, roughness: 0.2, side: THREE.DoubleSide, depthWrite: false })
          for (const s of [-1, 1]) {
            const wing = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 18), wingMat)
            wing.scale.set(0.46, 0.05, 0.95)
            const root = new THREE.Vector3(s * 0.18, 0.6, 0.46)
            const tip = new THREE.Vector3(s * 1.02, 0.48, -0.66)
            wing.position.copy(root.clone().add(tip).multiplyScalar(0.5))
            wing.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tip.clone().sub(root).normalize())
            bee.add(wing)
          }
          g.add(bee)
          if (queen) {
            const gold = new THREE.MeshStandardMaterial({ color: 0xffd24a, roughness: 0.32, metalness: 0.55 })
            const band = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.29, 0.16, 16), gold)
            band.position.set(0, 0.82, 0.98)
            bee.add(band)
            for (let i = 0; i < 6; i++) {
              const a = (i / 6) * Math.PI * 2
              const sp = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.12, 8), gold)
              sp.position.set(Math.sin(a) * 0.17, 0.94, 0.98 + Math.cos(a) * 0.17)
              bee.add(sp)
            }
            const ring = new THREE.Mesh(new THREE.TorusGeometry(1.78, 0.05, 12, 90), new THREE.MeshStandardMaterial({ color: 0xcf2a1c, roughness: 0.5 }))
            ring.rotation.x = Math.PI / 2
            ring.position.y = 0.31
            g.add(ring)
          }
          return g
        }

        // ---- 샘플 보드(실전 중반 모양): 노랑 5타일 벌집 줄 + 양 진영 말 + 여왕벌 1 ----
        // [q, r, tileOwner, pieceOwner|null, queen?]
        const CELLS = [
          [0, 0, 'yellow', 'yellow'],
          [1, 0, 'yellow', null],
          [2, 0, 'yellow', 'brown'],
          [3, 0, 'yellow', null],
          [4, 0, 'yellow', 'yellow'],
          [0, 1, 'brown', 'brown'],
          [1, 1, 'brown', null],
          [2, 1, 'yellow', 'yellow', true],
          [3, 1, 'brown', null],
          [0, -1, 'yellow', null],
          [1, -1, 'brown', 'brown'],
          [2, -1, 'yellow', 'yellow'],
          [3, -1, 'brown', null],
          [-1, 0, 'brown', null],
          [-1, 1, 'yellow', null],
          [4, 1, 'brown', 'brown'],
        ]
        const HIVE = new Set(['0,0', '1,0', '2,0', '3,0', '4,0']) // 노랑 5목 = 벌집(글로우)

        // 보드 중심을 원점으로(카메라 단순화)
        let cx = 0
        let cz = 0
        for (const [q, r] of CELLS) {
          const p = hexToXZ(q, r)
          cx += p.x
          cz += p.z
        }
        cx /= CELLS.length
        cz /= CELLS.length

        const board = new THREE.Group()
        const PIECE_K = 0.33
        const TILE_TOP = 0.22 // 타일 윗면 y
        const tiles = [] // 레이캐스팅용(셀 좌표·말 유무 포함)
        for (const [q, r, tileOwner, pieceOwner, queen] of CELLS) {
          const p = hexToXZ(q, r)
          const x = p.x - cx
          const z = p.z - cz
          const tile = hexTile(tileOwner, HIVE.has(`${q},${r}`))
          tile.position.set(x, 0, z)
          board.add(tile)
          tiles.push({ mesh: tile, q, r, x, z, hasPiece: !!pieceOwner })
          if (pieceOwner) {
            const tk = buildPiece(pieceOwner, !!queen)
            tk.scale.setScalar(PIECE_K)
            tk.position.set(x, TILE_TOP + 0.3 * PIECE_K, z) // 원판 바닥(−0.3*K)을 타일 윗면에
            board.add(tk)
          }
        }
        scene.add(board)

        const controls = new OrbitControls(camera, renderer.domElement)
        controls.target.set(0, 0.4, 0)
        controls.enableDamping = true
        controls.autoRotate = true
        controls.autoRotateSpeed = 0.7
        controls.minDistance = 5
        controls.maxDistance = 30

        // ---- 2단계: 레이캐스팅 입력(헥스 히트테스트) ----
        // 마우스 아래 타일을 찾아 호버 링(초록=게임의 '여기 둘 수 있음' 색) 표시, 클릭하면 선택 링(파랑).
        // 드래그(카메라 회전)는 선택으로 치지 않는다(이동 거리 임계). 실제 수 적용은 엔진 연결(다음)에서.
        const raycaster = new THREE.Raycaster()
        const ndc = new THREE.Vector2()
        const tileMeshes = tiles.map((t) => t.mesh)
        const ringGeo = new THREE.TorusGeometry(TILE_SIZE * 0.84, 0.05, 10, 6)
        const hoverRing = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ color: 0x16a34a, emissive: 0x16a34a, emissiveIntensity: 0.7 }))
        hoverRing.rotation.x = Math.PI / 2 // 보드 면(XZ)에 눕힘 + 꼭짓점 방향 맞춤
        hoverRing.visible = false
        scene.add(hoverRing)
        const selRing = new THREE.Mesh(ringGeo.clone(), new THREE.MeshStandardMaterial({ color: 0x2563eb, emissive: 0x2563eb, emissiveIntensity: 0.7 }))
        selRing.rotation.x = Math.PI / 2
        selRing.visible = false
        scene.add(selRing)
        function pickTile(ev) {
          const rect = renderer.domElement.getBoundingClientRect()
          ndc.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1
          ndc.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1
          raycaster.setFromCamera(ndc, camera)
          const hit = raycaster.intersectObjects(tileMeshes, false)[0]
          return hit ? tiles.find((t) => t.mesh === hit.object) : null
        }
        renderer.domElement.addEventListener('pointermove', (ev) => {
          const t = pickTile(ev)
          if (t) {
            hoverRing.position.set(t.x, TILE_TOP + 0.02, t.z)
            hoverRing.visible = true
            renderer.domElement.style.cursor = 'pointer'
          } else {
            hoverRing.visible = false
            renderer.domElement.style.cursor = 'grab'
          }
        })
        let downPos = null
        renderer.domElement.addEventListener('pointerdown', (ev) => {
          downPos = { x: ev.clientX, y: ev.clientY }
        })
        renderer.domElement.addEventListener('pointerup', (ev) => {
          if (!downPos) return
          const moved = Math.hypot(ev.clientX - downPos.x, ev.clientY - downPos.y)
          downPos = null
          if (moved > 6) return // 드래그(카메라 회전)는 선택 아님
          const t = pickTile(ev)
          if (t) {
            selRing.position.set(t.x, TILE_TOP + 0.03, t.z)
            selRing.visible = true
          }
        })

        addEventListener('resize', () => {
          camera.aspect = innerWidth / innerHeight
          camera.updateProjectionMatrix()
          renderer.setSize(innerWidth, innerHeight)
        })

        function loop() {
          controls.update()
          renderer.render(scene, camera)
          window.__rendered = true
          requestAnimationFrame(loop)
        }
        loop()
      } catch (e) {
        console.error(e)
        document.getElementById('err').style.display = 'flex'
        document.getElementById('hint').style.display = 'none'
      }
    </script>
  </body>
</html>
