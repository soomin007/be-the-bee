<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Be the Bee — three.js 3D 토큰 시연</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, #fbf3de, #efe0bd);
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        color: #6e5114;
        background: #fff8e6cc;
        border: 1px solid #e3cf9c;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 14px;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #8a3b1d;
        padding: 24px;
      }
    </style>
    <!-- 번들 없이 브라우저가 직접 three.js 를 CDN 에서 불러온다(이 데모는 public/ 정적 파일이라 Vite 가 손대지 않음). -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0",
          "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hint">드래그로 돌려보세요 · 휠로 확대 · 자동 회전 중</div>
    <div id="err">three.js 를 CDN 에서 불러오지 못했어요. 인터넷 연결을 확인하세요.</div>
    <script type="module">
      try {
        const THREE = await import('three')
        const { OrbitControls } = await import('three/addons/controls/OrbitControls.js')

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100)
        camera.position.set(2.6, 3.4, 6.2)

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
        renderer.setSize(innerWidth, innerHeight)
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
        renderer.shadowMap.enabled = true
        renderer.shadowMap.type = THREE.PCFSoftShadowMap
        document.body.appendChild(renderer.domElement)

        // 조명 — 게임의 SVG 와 같은 "왼쪽 위" 광원 + 부드러운 채움광
        scene.add(new THREE.AmbientLight(0xfff4d8, 0.85))
        const key = new THREE.DirectionalLight(0xfff1c0, 1.25)
        key.position.set(-4, 7, 4)
        key.castShadow = true
        key.shadow.mapSize.set(1024, 1024)
        scene.add(key)
        const fill = new THREE.DirectionalLight(0xffffff, 0.35)
        fill.position.set(5, 3, 2)
        scene.add(fill)

        // 바닥(은은한 꿀색 그림자 받이)
        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(9, 48),
          new THREE.ShadowMaterial({ opacity: 0.18 }),
        )
        ground.rotation.x = -Math.PI / 2
        ground.position.y = -0.001
        ground.receiveShadow = true
        scene.add(ground)

        const mat = (c, rough = 0.55) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0.05 })

        // 두께 있는 육각 타일
        function hexTile(color) {
          const g = new THREE.Group()
          const tile = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 0.92, 0.22, 6), mat(color, 0.7))
          tile.castShadow = tile.receiveShadow = true
          tile.position.y = 0.11
          g.add(tile)
          return g
        }

        // 벌 무늬(줄무늬 + 얼굴/눈)를 캔버스에 "색칠"해 텍스처로 만든다 → 매끈한 몸통 위에 그림만 입힘.
        // (실물 보드게임 말처럼: 돌출된 부속 없이 평평하게 그려진 무늬·눈)
        function beeTexture(base) {
          const c = document.createElement('canvas')
          c.width = 256
          c.height = 256
          const x = c.getContext('2d')
          x.fillStyle = base
          x.fillRect(0, 0, 256, 256)
          // 가로 줄무늬(검정) = 위도 밴드 → 몸통을 빙 두른다. 얼굴 바로 아래(앞면에서 보이는 띠)에 배치.
          x.fillStyle = '#241603'
          for (const [y, h] of [[98, 20], [128, 20], [158, 18]]) x.fillRect(0, y, 256, h)
          // 얼굴(머리) — 위쪽 중앙 검은 영역
          x.fillStyle = '#231507'
          x.beginPath()
          x.ellipse(128, 60, 72, 52, 0, 0, Math.PI * 2)
          x.fill()
          // 큰 흰 눈 2개 + 검은 눈동자 + 반짝임(납작하게 색칠)
          for (const ex of [98, 158]) {
            const dir = ex < 128 ? 1 : -1
            x.fillStyle = '#ffffff'
            x.beginPath()
            x.ellipse(ex, 60, 19, 24, 0, 0, 7)
            x.fill()
            x.fillStyle = '#15100a'
            x.beginPath()
            x.ellipse(ex + dir * 3, 68, 9, 10, 0, 0, 7)
            x.fill()
            x.fillStyle = '#ffffff'
            x.beginPath()
            x.ellipse(ex + dir * 3 - 3, 63, 3.2, 3.2, 0, 0, 7)
            x.fill()
          }
          const tex = new THREE.CanvasTexture(c)
          tex.anisotropy = 4
          return tex
        }

        // 매끈한 돔형 벌(무늬·눈은 텍스처로 색칠). 타일에 반쯤 박힌다. 디스크/더듬이/돌출 눈 없음.
        function token(base) {
          const g = new THREE.Group()
          const body = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 44, 30),
            new THREE.MeshStandardMaterial({ map: beeTexture(base), roughness: 0.42, metalness: 0.04 }),
          )
          body.scale.set(1.0, 0.8, 1.05)
          body.position.set(0, 0.4, 0)
          body.castShadow = true
          g.add(body)
          return g
        }

        // 작은 클러스터 배치(가운데 노랑, 둘레 노랑/갈색 교대) — 게임 화면과 닮게
        const TILE = { yellow: 0xf0c531, brown: 0x97581d }
        const BODY = { yellow: '#f4c12a', brown: '#a8702c' } // 진영색 벌 몸통(SVG 게임 말과 동일 방향)
        const layout = [
          [0, 0, 'yellow'],
          [1.6, 0, 'brown'],
          [-1.6, 0, 'brown'],
          [0.8, 1.4, 'yellow'],
          [-0.8, 1.4, 'yellow'],
          [0.8, -1.4, 'yellow'],
          [-0.8, -1.4, 'brown'],
        ]
        for (const [x, z, side] of layout) {
          const t = hexTile(TILE[side])
          t.position.set(x, 0, z)
          scene.add(t)
          const tk = token(BODY[side])
          tk.position.set(x, 0, z) // 벌이 타일에 반쯤 박히게(token 내부에서 y 위치 잡음)
          scene.add(tk)
        }

        const controls = new OrbitControls(camera, renderer.domElement)
        controls.target.set(0, 0.4, 0)
        controls.enableDamping = true
        controls.autoRotate = true
        controls.autoRotateSpeed = 1.4
        controls.minDistance = 3
        controls.maxDistance = 14

        addEventListener('resize', () => {
          camera.aspect = innerWidth / innerHeight
          camera.updateProjectionMatrix()
          renderer.setSize(innerWidth, innerHeight)
        })

        function loop() {
          controls.update()
          renderer.render(scene, camera)
          window.__rendered = true
          requestAnimationFrame(loop)
        }
        loop()
      } catch (e) {
        console.error(e)
        document.getElementById('err').style.display = 'flex'
        document.getElementById('hint').style.display = 'none'
      }
    </script>
  </body>
</html>
