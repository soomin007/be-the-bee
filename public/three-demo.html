<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Be the Bee — three.js 3D 토큰 시연</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, #fbf3de, #efe0bd);
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        color: #6e5114;
        background: #fff8e6cc;
        border: 1px solid #e3cf9c;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 14px;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #8a3b1d;
        padding: 24px;
      }
    </style>
    <!-- 번들 없이 브라우저가 직접 three.js 를 CDN 에서 불러온다(이 데모는 public/ 정적 파일이라 Vite 가 손대지 않음). -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0",
          "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hint">드래그로 돌려보세요 · 휠로 확대 · 자동 회전 중</div>
    <div id="err">three.js 를 CDN 에서 불러오지 못했어요. 인터넷 연결을 확인하세요.</div>
    <script type="module">
      try {
        const THREE = await import('three')
        const { OrbitControls } = await import('three/addons/controls/OrbitControls.js')

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100)
        camera.position.set(2.2, 4.6, 5.4) // 위에서 내려다보는 각(탑다운 벌이 잘 보이게)

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
        renderer.setSize(innerWidth, innerHeight)
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
        renderer.shadowMap.enabled = true
        renderer.shadowMap.type = THREE.PCFSoftShadowMap
        document.body.appendChild(renderer.domElement)

        // 조명 — 게임의 SVG 와 같은 "왼쪽 위" 광원 + 부드러운 채움광
        scene.add(new THREE.AmbientLight(0xfff4d8, 0.85))
        const key = new THREE.DirectionalLight(0xfff1c0, 1.25)
        key.position.set(-4, 7, 4)
        key.castShadow = true
        key.shadow.mapSize.set(1024, 1024)
        scene.add(key)
        const fill = new THREE.DirectionalLight(0xffffff, 0.35)
        fill.position.set(5, 3, 2)
        scene.add(fill)

        // 바닥(은은한 꿀색 그림자 받이)
        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(9, 48),
          new THREE.ShadowMaterial({ opacity: 0.18 }),
        )
        ground.rotation.x = -Math.PI / 2
        ground.position.y = -0.001
        ground.receiveShadow = true
        scene.add(ground)

        const mat = (c, rough = 0.55) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0.05 })

        // 두께 있는 육각 타일
        function hexTile(color) {
          const g = new THREE.Group()
          const tile = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 0.92, 0.22, 6), mat(color, 0.7))
          tile.castShadow = tile.receiveShadow = true
          tile.position.y = 0.11
          g.add(tile)
          return g
        }

        // 위에서 내려다본 벌(타일에 배를 대고 엎드린 모습) — 절차적 프리미티브로 조립.
        //   머리(앞 +z) → 가슴 → 길쭉한 마디 배(노랑/검정 교대 = 줄무늬, 뒤로 갈수록 가늘게).
        //   등 위로 납작한 흰 날개가 또렷이 펼쳐진다. SVG 게임 말과 같은 탑다운 방향, Blender 없이.
        function blob(color, s, pos, opts = {}) {
          const m = new THREE.Mesh(
            new THREE.SphereGeometry(1, 28, 18),
            new THREE.MeshStandardMaterial({
              color,
              roughness: opts.rough ?? 0.5,
              metalness: 0.03,
              transparent: opts.opacity != null,
              opacity: opts.opacity ?? 1,
            }),
          )
          m.scale.set(s[0], s[1], s[2]) // (폭 x · 높이 y(납작) · 길이 z)
          m.position.set(pos[0], pos[1], pos[2])
          m.castShadow = opts.shadow ?? true
          return m
        }

        function token(base) {
          const g = new THREE.Group()
          const Y = 0.33 // 몸통 중심 높이(배 바닥이 타일에 살짝 박힘 = 엎드린 느낌)
          // 배: 마디 5개를 +z(머리)→-z(꼬리)로 쌓아 노랑(진영)·검정 교대 = 또렷한 줄무늬
          const seg = [
            [base, [0.4, 0.14, 0.17], 0.02],
            ['#241603', [0.38, 0.13, 0.13], -0.16],
            [base, [0.33, 0.13, 0.12], -0.3],
            ['#241603', [0.26, 0.12, 0.11], -0.42],
            [base, [0.16, 0.11, 0.1], -0.52],
          ]
          for (const [c, s, z] of seg) g.add(blob(c, s, [0, Y, z], { rough: 0.45 }))
          // 가슴(둥근 털북숭이, 어둑한 갈색)
          g.add(blob('#5b3e1e', [0.34, 0.15, 0.22], [0, Y + 0.01, 0.26], { rough: 0.78 }))
          // 머리(앞, 검정 — 작게)
          g.add(blob('#241606', [0.24, 0.13, 0.2], [0, Y, 0.5], { rough: 0.5 }))
          // 작은 눈 2개
          for (const dir of [-1, 1]) g.add(blob('#000', [0.06, 0.06, 0.05], [dir * 0.12, Y + 0.06, 0.56], { rough: 0.2, shadow: false }))
          // 더듬이 2개(가는 막대 + 끝 점, 앞으로)
          for (const dir of [-1, 1]) {
            const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.26, 8), mat('#1c1208', 0.6))
            ant.position.set(dir * 0.1, Y + 0.12, 0.66)
            ant.rotation.set(-0.6, 0, dir * 0.4)
            g.add(ant)
            g.add(blob('#1c1208', [0.03, 0.03, 0.03], [dir * 0.16, Y + 0.2, 0.74], { shadow: false }))
          }
          // 날개 2장(등 위로 또렷한 납작 흰 날개, 뒤·바깥으로 펼침 → 가운데 줄무늬는 안 가림)
          for (const dir of [-1, 1]) {
            const w = blob('#ffffff', [0.5, 0.04, 0.26], [dir * 0.22, Y + 0.15, 0.04], { rough: 0.3, opacity: 0.6, shadow: false })
            w.rotation.y = dir * 0.5
            g.add(w)
          }
          return g
        }

        // 작은 클러스터 배치(가운데 노랑, 둘레 노랑/갈색 교대) — 게임 화면과 닮게
        const TILE = { yellow: 0xf0c531, brown: 0x97581d }
        const BODY = { yellow: '#f4c12a', brown: '#a8702c' } // 진영색 벌 몸통(SVG 게임 말과 동일 방향)
        const layout = [
          [0, 0, 'yellow'],
          [1.6, 0, 'brown'],
          [-1.6, 0, 'brown'],
          [0.8, 1.4, 'yellow'],
          [-0.8, 1.4, 'yellow'],
          [0.8, -1.4, 'yellow'],
          [-0.8, -1.4, 'brown'],
        ]
        for (const [x, z, side] of layout) {
          const t = hexTile(TILE[side])
          t.position.set(x, 0, z)
          scene.add(t)
          const tk = token(BODY[side])
          tk.position.set(x, 0, z) // 벌이 타일에 반쯤 박히게(token 내부에서 y 위치 잡음)
          scene.add(tk)
        }

        const controls = new OrbitControls(camera, renderer.domElement)
        controls.target.set(0, 0.4, 0)
        controls.enableDamping = true
        controls.autoRotate = true
        controls.autoRotateSpeed = 1.4
        controls.minDistance = 3
        controls.maxDistance = 14

        addEventListener('resize', () => {
          camera.aspect = innerWidth / innerHeight
          camera.updateProjectionMatrix()
          renderer.setSize(innerWidth, innerHeight)
        })

        function loop() {
          controls.update()
          renderer.render(scene, camera)
          window.__rendered = true
          requestAnimationFrame(loop)
        }
        loop()
      } catch (e) {
        console.error(e)
        document.getElementById('err').style.display = 'flex'
        document.getElementById('hint').style.display = 'none'
      }
    </script>
  </body>
</html>
