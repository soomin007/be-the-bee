<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Be the Bee — three.js 3D 토큰 시연</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, #fbf3de, #efe0bd);
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        color: #6e5114;
        background: #fff8e6cc;
        border: 1px solid #e3cf9c;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 14px;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #8a3b1d;
        padding: 24px;
      }
    </style>
    <!-- 번들 없이 브라우저가 직접 three.js 를 CDN 에서 불러온다(이 데모는 public/ 정적 파일이라 Vite 가 손대지 않음). -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0",
          "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hint">드래그로 돌려보세요 · 휠로 확대 · 자동 회전 중</div>
    <div id="err">three.js 를 CDN 에서 불러오지 못했어요. 인터넷 연결을 확인하세요.</div>
    <script type="module">
      try {
        const THREE = await import('three')
        const { OrbitControls } = await import('three/addons/controls/OrbitControls.js')

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100)
        camera.position.set(2.6, 3.4, 6.2)

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
        renderer.setSize(innerWidth, innerHeight)
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
        renderer.shadowMap.enabled = true
        renderer.shadowMap.type = THREE.PCFSoftShadowMap
        document.body.appendChild(renderer.domElement)

        // 조명 — 게임의 SVG 와 같은 "왼쪽 위" 광원 + 부드러운 채움광
        scene.add(new THREE.AmbientLight(0xfff4d8, 0.85))
        const key = new THREE.DirectionalLight(0xfff1c0, 1.25)
        key.position.set(-4, 7, 4)
        key.castShadow = true
        key.shadow.mapSize.set(1024, 1024)
        scene.add(key)
        const fill = new THREE.DirectionalLight(0xffffff, 0.35)
        fill.position.set(5, 3, 2)
        scene.add(fill)

        // 바닥(은은한 꿀색 그림자 받이)
        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(9, 48),
          new THREE.ShadowMaterial({ opacity: 0.18 }),
        )
        ground.rotation.x = -Math.PI / 2
        ground.position.y = -0.001
        ground.receiveShadow = true
        scene.add(ground)

        const mat = (c, rough = 0.55) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0.05 })

        // 두께 있는 육각 타일
        function hexTile(color) {
          const g = new THREE.Group()
          const tile = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 0.92, 0.22, 6), mat(color, 0.7))
          tile.castShadow = tile.receiveShadow = true
          tile.position.y = 0.11
          g.add(tile)
          return g
        }

        // 줄무늬(배)·머리색을 캔버스에 "색칠"해 텍스처로. LatheGeometry 의 v(축 방향: 0=꼬리 → 1=머리)에
        // 맞춰 가로 밴드로 그린다 → 회전체 둘레를 띠가 두른다. 눈은 별도 납작 원판(아래 token).
        function beeTexture(base) {
          const c = document.createElement('canvas')
          c.width = 128
          c.height = 256
          const x = c.getContext('2d')
          x.fillStyle = base
          x.fillRect(0, 0, 128, 256)
          // 머리(검정) = 텍스처 위쪽(v 큰 쪽 = 머리). 둘레 전체를 두름.
          x.fillStyle = '#231507'
          x.fillRect(0, 0, 128, 70)
          // 배 줄무늬(검정 띠) — 배 영역에 촘촘히
          x.fillStyle = '#241603'
          for (const y of [108, 134, 160, 186]) x.fillRect(0, y, 128, 14)
          // 눈: 눕힌 회전체의 "위쪽"은 u≈0.75(=캔버스 x≈96). 머리(위쪽 v)의 그 지점에 눈을 색칠.
          for (const ex of [84, 108] ) {
            const dir = ex < 96 ? 1 : -1
            x.fillStyle = '#ffffff'
            x.beginPath()
            x.ellipse(ex, 36, 9, 12, 0, 0, 7)
            x.fill()
            x.fillStyle = '#15100a'
            x.beginPath()
            x.ellipse(ex + dir * 2, 41, 4.6, 5, 0, 0, 7)
            x.fill()
            x.fillStyle = '#ffffff'
            x.beginPath()
            x.ellipse(ex + dir * 2 - 1.5, 38, 1.6, 1.6, 0, 0, 7)
            x.fill()
          }
          const tex = new THREE.CanvasTexture(c)
          tex.anisotropy = 4
          return tex
        }

        // 옆에서 본 벌 실루엣(x=반지름, y=축 0=꼬리→1=머리): 배(통통)→허리(잘록)→머리(둥글)→끝.
        function beeProfile() {
          const p = [
            [0.03, 0.0],
            [0.26, 0.06],
            [0.4, 0.16],
            [0.46, 0.3],
            [0.46, 0.44],
            [0.41, 0.54],
            [0.3, 0.62],
            [0.25, 0.66], // 허리(잘록)
            [0.32, 0.71],
            [0.4, 0.79], // 머리 불룩
            [0.4, 0.86],
            [0.31, 0.93],
            [0.16, 0.98],
            [0.03, 1.0],
          ]
          return p.map(([x, y]) => new THREE.Vector2(x, y))
        }

        // 길쭉한 회전체 벌(LatheGeometry). 눕혀서 위아래로 납작하게, 타일에 반쯤 박는다.
        // 눈만 머리 위에 납작한 원판으로(색칠한 것처럼, 돌출 X).
        function token(base) {
          const g = new THREE.Group()
          const body = new THREE.Mesh(
            new THREE.LatheGeometry(beeProfile(), 48),
            new THREE.MeshStandardMaterial({ map: beeTexture(base), roughness: 0.45, metalness: 0.03 }),
          )
          body.castShadow = true
          body.rotation.x = Math.PI / 2 // 축(길이)을 +z 로 눕힘(머리 +z, 카메라 쪽)
          body.scale.set(0.9, 1.0, 0.5) // x 폭 · y 길이(유지=길쭉) · z 높이(납작)
          body.position.set(0, 0.25, -0.5) // 길이축 가운데로 + 타일에 반쯤 박힘
          g.add(body)
          return g
        }

        // 작은 클러스터 배치(가운데 노랑, 둘레 노랑/갈색 교대) — 게임 화면과 닮게
        const TILE = { yellow: 0xf0c531, brown: 0x97581d }
        const BODY = { yellow: '#f4c12a', brown: '#a8702c' } // 진영색 벌 몸통(SVG 게임 말과 동일 방향)
        const layout = [
          [0, 0, 'yellow'],
          [1.6, 0, 'brown'],
          [-1.6, 0, 'brown'],
          [0.8, 1.4, 'yellow'],
          [-0.8, 1.4, 'yellow'],
          [0.8, -1.4, 'yellow'],
          [-0.8, -1.4, 'brown'],
        ]
        for (const [x, z, side] of layout) {
          const t = hexTile(TILE[side])
          t.position.set(x, 0, z)
          scene.add(t)
          const tk = token(BODY[side])
          tk.position.set(x, 0, z) // 벌이 타일에 반쯤 박히게(token 내부에서 y 위치 잡음)
          scene.add(tk)
        }

        const controls = new OrbitControls(camera, renderer.domElement)
        controls.target.set(0, 0.4, 0)
        controls.enableDamping = true
        controls.autoRotate = true
        controls.autoRotateSpeed = 1.4
        controls.minDistance = 3
        controls.maxDistance = 14

        addEventListener('resize', () => {
          camera.aspect = innerWidth / innerHeight
          camera.updateProjectionMatrix()
          renderer.setSize(innerWidth, innerHeight)
        })

        function loop() {
          controls.update()
          renderer.render(scene, camera)
          window.__rendered = true
          requestAnimationFrame(loop)
        }
        loop()
      } catch (e) {
        console.error(e)
        document.getElementById('err').style.display = 'flex'
        document.getElementById('hint').style.display = 'none'
      }
    </script>
  </body>
</html>
