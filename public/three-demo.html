<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Be the Bee — 3D 벌(스타일 토큰 버전)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, #fbf3de, #efe0bd);
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        color: #6e5114;
        background: #fff8e6cc;
        border: 1px solid #e3cf9c;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 14px;
      }
      #nav {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
      }
      #nav a {
        color: #6e5114;
        text-decoration: none;
        background: #fff8e6cc;
        border: 1px solid #e3cf9c;
        border-radius: 999px;
        padding: 6px 14px;
        margin: 0 4px;
      }
      #nav a.on {
        background: #6e5114;
        color: #fff8e6;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #8a3b1d;
        padding: 24px;
      }
    </style>
    <!-- 번들 없이 브라우저가 직접 three.js 를 CDN 에서 불러온다(이 데모는 public/ 정적 파일이라 Vite 가 손대지 않음). -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0",
          "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="nav"><a href="three-demo.html" class="on">① 스타일(회전체 2개)</a><a href="three-demo-real.html">② 현실 벌</a></div>
    <div id="hint">드래그로 돌려보세요 · 휠로 확대 · 자동 회전 중 — 스타일(토큰) 버전</div>
    <div id="err">three.js 를 CDN 에서 불러오지 못했어요. 인터넷 연결을 확인하세요.</div>
    <script type="module">
      try {
        const THREE = await import('three')
        const { OrbitControls } = await import('three/addons/controls/OrbitControls.js')

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100)
        camera.position.set(2.2, 4.6, 5.4) // 위에서 내려다보는 각(탑다운 벌이 잘 보이게)

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
        renderer.setSize(innerWidth, innerHeight)
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
        renderer.shadowMap.enabled = true
        renderer.shadowMap.type = THREE.PCFSoftShadowMap
        document.body.appendChild(renderer.domElement)

        // 조명 — 게임의 SVG 와 같은 "왼쪽 위" 광원 + 부드러운 채움광
        scene.add(new THREE.AmbientLight(0xfff4d8, 0.85))
        const key = new THREE.DirectionalLight(0xfff1c0, 1.25)
        key.position.set(-4, 7, 4)
        key.castShadow = true
        key.shadow.mapSize.set(1024, 1024)
        scene.add(key)
        const fill = new THREE.DirectionalLight(0xffffff, 0.35)
        fill.position.set(5, 3, 2)
        scene.add(fill)

        // 바닥(은은한 꿀색 그림자 받이)
        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(9, 48),
          new THREE.ShadowMaterial({ opacity: 0.18 }),
        )
        ground.rotation.x = -Math.PI / 2
        ground.position.y = -0.001
        ground.receiveShadow = true
        scene.add(ground)

        const mat = (c, rough = 0.55) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0.05 })

        // 두께 있는 육각 타일
        function hexTile(color) {
          const g = new THREE.Group()
          const tile = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 0.92, 0.22, 6), mat(color, 0.7))
          tile.castShadow = tile.receiveShadow = true
          tile.position.y = 0.11
          g.add(tile)
          return g
        }

        // 말 = 원판 위의 벌. SVG 말 디자인을 회전체 "돔"으로 옮긴 느낌:
        //   몸통 = 회전체 돔(Lathe) + 표면에 svg식 줄무늬 색칠(노랑 + 검정 2줄 + 검정 꼬리),
        //   머리 = 회전체 구(검정), 흰 눈·흰 날개로 svg 실루엣을 살린다. 진영 = 원판 색.

        // 몸통 표면 줄무늬 텍스처(머리쪽=캔버스 위 → 꼬리=캔버스 아래): svg처럼 노랑+검정2줄+검정꼬리
        function bodyTexture() {
          const c = document.createElement('canvas')
          c.width = 64
          c.height = 256
          const x = c.getContext('2d')
          x.fillStyle = '#f4b70e'
          x.fillRect(0, 0, 64, 256) // 노랑 바탕(svg body 그라데이션 중간색)
          x.fillStyle = '#1d150b'
          x.fillRect(0, 70, 64, 24) // 검정 줄 1
          x.fillRect(0, 122, 64, 24) // 검정 줄 2
          x.fillRect(0, 186, 64, 70) // 검정 꼬리(아래 통검정)
          const t = new THREE.CanvasTexture(c)
          t.anisotropy = 4
          return t
        }

        // 몸통 회전체 옆선(x=반지름, y=축 0=꼬리→1=머리쪽): 꼬리(점)→통통→머리쪽(좁아짐)
        function bodyProfile() {
          return [
            [0.02, 0.0],
            [0.16, 0.05],
            [0.27, 0.14],
            [0.34, 0.3],
            [0.37, 0.5],
            [0.36, 0.68],
            [0.3, 0.82],
            [0.18, 0.93],
            [0.04, 1.0],
          ].map(([x, y]) => new THREE.Vector2(x, y))
        }

        const TILE = { yellow: 0xf0c531, brown: 0x97581d }
        const DISC = { yellow: '#d8a92b', brown: '#743f30' } // 진영 = 원판 색(실물 보드게임)

        function token(side) {
          const g = new THREE.Group()
          // 원판(진영색)
          const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.66, 0.66, 0.14, 40), mat(DISC[side], 0.6))
          disc.position.y = 0.29
          disc.castShadow = disc.receiveShadow = true
          g.add(disc)

          // 벌(원판 위) — svg 디자인을 회전체 돔으로. 그룹으로 묶어 살짝 축소한다.
          const b = new THREE.Group()
          const Y = 0.44
          // 몸통 = 회전체 돔(Lathe) + svg식 줄무늬 텍스처. 높이를 키워 도톰한 돔으로.
          const body = new THREE.Mesh(
            new THREE.LatheGeometry(bodyProfile(), 48),
            new THREE.MeshStandardMaterial({ map: bodyTexture(), roughness: 0.5, metalness: 0.02 }),
          )
          body.castShadow = true
          body.rotation.x = Math.PI / 2 // 길이축(원래 +y)을 +z(머리)로 눕힘
          body.scale.set(1.28, 1.18, 0.98) // 폭 · 길이 · 높이 — 도톰한 돔
          body.position.set(0, Y, -0.59)
          b.add(body)
          // 흰 날개 2장(svg 처럼 몸 옆으로 펼침 — 납작 반투명)
          const wingMat = new THREE.MeshStandardMaterial({ color: '#fbfaf6', roughness: 0.3, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
          for (const dir of [-1, 1]) {
            const w = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 10), wingMat)
            w.scale.set(0.12, 0.02, 0.32)
            w.position.set(dir * 0.34, Y + 0.16, -0.02)
            w.rotation.set(0.1, dir * 0.7, dir * 0.22)
            b.add(w)
          }
          // 머리 = 회전체 돔(구), 검정, 앞(+z)
          const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 28, 20), mat('#15100a', 0.5))
          head.scale.set(1, 0.95, 0.95)
          head.position.set(0, Y + 0.07, 0.55)
          head.castShadow = true
          b.add(head)
          // 흰 눈 2개(머리 윗면 decal — 파묻히지 않게 위로)
          for (const dir of [-1, 1]) {
            const eye = new THREE.Mesh(new THREE.CircleGeometry(0.045, 16), mat('#ffffff', 0.35))
            eye.position.set(dir * 0.08, Y + 0.27, 0.61)
            eye.rotation.x = -1.2
            b.add(eye)
          }
          g.add(b)
          // 벌 크기 축소 — 원판 윗면(y=0.36)을 기준점으로 0.85배(원판은 그대로)
          b.scale.setScalar(0.85)
          b.position.y = 0.36 * (1 - 0.85)
          return g
        }

        // 작은 클러스터 배치(노랑/갈색 원판 교대) — 두 진영 다 보이게
        const layout = [
          [0, 0, 'yellow'],
          [1.6, 0, 'brown'],
          [-1.6, 0, 'brown'],
          [0.8, 1.4, 'yellow'],
          [-0.8, 1.4, 'yellow'],
          [0.8, -1.4, 'brown'],
          [-0.8, -1.4, 'yellow'],
        ]
        for (const [x, z, side] of layout) {
          const t = hexTile(TILE[side])
          t.position.set(x, 0, z)
          scene.add(t)
          const tk = token(side)
          tk.position.set(x, 0, z)
          scene.add(tk)
        }

        const controls = new OrbitControls(camera, renderer.domElement)
        controls.target.set(0, 0.4, 0)
        controls.enableDamping = true
        controls.autoRotate = true
        controls.autoRotateSpeed = 1.4
        controls.minDistance = 3
        controls.maxDistance = 14

        addEventListener('resize', () => {
          camera.aspect = innerWidth / innerHeight
          camera.updateProjectionMatrix()
          renderer.setSize(innerWidth, innerHeight)
        })

        function loop() {
          controls.update()
          renderer.render(scene, camera)
          window.__rendered = true
          requestAnimationFrame(loop)
        }
        loop()
      } catch (e) {
        console.error(e)
        document.getElementById('err').style.display = 'flex'
        document.getElementById('hint').style.display = 'none'
      }
    </script>
  </body>
</html>
