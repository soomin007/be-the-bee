<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Be the Bee — 3D 벌(스타일 토큰 버전)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 30%, #fbf3de, #efe0bd);
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        color: #6e5114;
        background: #fff8e6cc;
        border: 1px solid #e3cf9c;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 14px;
      }
      #nav {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
      }
      #nav a {
        color: #6e5114;
        text-decoration: none;
        background: #fff8e6cc;
        border: 1px solid #e3cf9c;
        border-radius: 999px;
        padding: 6px 14px;
        margin: 0 4px;
      }
      #nav a.on {
        background: #6e5114;
        color: #fff8e6;
      }
      #err {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #8a3b1d;
        padding: 24px;
      }
    </style>
    <!-- 번들 없이 브라우저가 직접 three.js 를 CDN 에서 불러온다(이 데모는 public/ 정적 파일이라 Vite 가 손대지 않음). -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.160.0",
          "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="nav"><a href="three-demo.html" class="on">① 스타일 토큰</a><a href="three-demo-real.html">② 현실 벌</a></div>
    <div id="hint">드래그로 돌려보세요 · 휠로 확대 · 자동 회전 중 — 스타일 토큰(Claude Design 핸드오프)</div>
    <div id="err">three.js 를 CDN 에서 불러오지 못했어요. 인터넷 연결을 확인하세요.</div>
    <script type="module">
      try {
        const THREE = await import('three')
        const { OrbitControls } = await import('three/addons/controls/OrbitControls.js')

        const scene = new THREE.Scene()
        const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100)
        camera.position.set(2.2, 4.6, 5.4) // 위에서 내려다보는 각(탑다운 벌이 잘 보이게)

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
        renderer.setSize(innerWidth, innerHeight)
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
        renderer.shadowMap.enabled = true
        renderer.shadowMap.type = THREE.PCFSoftShadowMap
        document.body.appendChild(renderer.domElement)

        // 조명 — 게임의 SVG 와 같은 "왼쪽 위" 광원 + 부드러운 채움광
        scene.add(new THREE.AmbientLight(0xfff4d8, 0.85))
        const key = new THREE.DirectionalLight(0xfff1c0, 1.25)
        key.position.set(-4, 7, 4)
        key.castShadow = true
        key.shadow.mapSize.set(1024, 1024)
        scene.add(key)
        const fill = new THREE.DirectionalLight(0xffffff, 0.35)
        fill.position.set(5, 3, 2)
        scene.add(fill)

        // 바닥(은은한 꿀색 그림자 받이)
        const ground = new THREE.Mesh(
          new THREE.CircleGeometry(9, 48),
          new THREE.ShadowMaterial({ opacity: 0.18 }),
        )
        ground.rotation.x = -Math.PI / 2
        ground.position.y = -0.001
        ground.receiveShadow = true
        scene.add(ground)

        const mat = (c, rough = 0.55) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0.05 })

        // 두께 있는 육각 타일
        function hexTile(color) {
          const g = new THREE.Group()
          const tile = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 0.92, 0.22, 6), mat(color, 0.7))
          tile.castShadow = tile.receiveShadow = true
          tile.position.y = 0.11
          g.add(tile)
          return g
        }

        // 말 = 원판 위의 벌. Claude Design 핸드오프(be-the-bee-handoff-v2-3d) 3D 스펙 이식:
        //   SVG 벌의 회전체(구) + 표면 캔버스 텍스처(노랑 + 검정 2줄 + 검정 꼬리) + 머리·평면 눈 스택·
        //   더듬이·반투명 날개. 진영 = 원판 색(gold/brown). 핸드오프 네이티브 스케일(원판 r=2)로 빌드 후 축소.

        const TILE = { yellow: 0xf0c531, brown: 0x97581d }

        // 몸통 줄무늬 텍스처(핸드오프 makeBodyTexture): 64×512, 노랑 바탕 + 검정 띠 2개 + 통검정 꼬리.
        function makeBodyTexture() {
          const w = 64
          const h = 512
          const cv = document.createElement('canvas')
          cv.width = w
          cv.height = h
          const x = cv.getContext('2d')
          x.fillStyle = '#f4b70e'
          x.fillRect(0, 0, w, h)
          const black = '#1d150b'
          const yToV = (v) => (1 - v) * h // v=1(머리극)=캔버스 위, v=0(꼬리)=아래
          x.fillStyle = black
          x.fillRect(0, yToV(0.28), w, h - yToV(0.28)) // 통검정 꼬리(아래 ~28%)
          const band = (v, th) => {
            x.fillStyle = black
            x.fillRect(0, yToV(v) - th / 2, w, th)
          }
          band(0.63, 48)
          band(0.45, 48)
          const t = new THREE.CanvasTexture(cv)
          t.anisotropy = 4
          t.wrapS = THREE.RepeatWrapping
          try {
            t.colorSpace = THREE.SRGBColorSpace
          } catch (e) {}
          return t
        }

        // 핸드오프 buildPiece 이식: 원판 + 벌(회전체) 한 세트(네이티브 스케일, 원판 반지름 2).
        function buildPiece(side, queen) {
          const discColor = side === 'yellow' ? 0xd2a230 : 0x542514
          const g = new THREE.Group()
          // 원판(두께 크게 — 벌이 ~30% 매몰) + 가장자리 토러스 림
          const disc = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.6, 72), new THREE.MeshStandardMaterial({ color: discColor, roughness: 0.82 }))
          disc.castShadow = disc.receiveShadow = true
          g.add(disc)
          const rim = new THREE.Mesh(new THREE.TorusGeometry(1.93, 0.09, 14, 80), new THREE.MeshStandardMaterial({ color: discColor, roughness: 0.7 }))
          rim.rotation.x = Math.PI / 2
          rim.position.y = 0.3
          g.add(rim)

          const black = new THREE.MeshStandardMaterial({ color: 0x1d150b, roughness: 0.55 })
          const R = 0.8
          const L = 1.15
          const bee = new THREE.Group()
          bee.position.y = 0.62

          // 몸통 = 구의 회전체(장축 z, 머리 +z/꼬리 −z) + 줄무늬 텍스처(릴리프 없음)
          const bodyGeo = new THREE.SphereGeometry(1, 64, 48)
          bodyGeo.rotateX(Math.PI / 2) // UV 극을 z축에 맞춤
          const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ map: makeBodyTexture(), roughness: 0.5 }))
          body.scale.set(R, R, L)
          body.castShadow = true
          bee.add(body)

          // 머리(검정 구)
          const head = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 30), black)
          head.scale.set(0.55, 0.55, 0.5)
          head.position.set(0, 0.24, 0.98)
          head.castShadow = true
          bee.add(head)

          // 눈: 머리 앞면에 얹는 평면 원반 스택(검은 테두리/흰자/큰 동공/하이라이트), 세로로 살짝 긴 타원
          const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, emissive: 0x444444, side: THREE.DoubleSide })
          const eyeDark = new THREE.MeshStandardMaterial({ color: 0x15100a, side: THREE.DoubleSide })
          const zAxis = new THREE.Vector3(0, 0, 1)
          const C = new THREE.Vector3(0, 0.24, 0.98)
          const rxh = 0.55
          const ryh = 0.55
          const rzh = 0.5
          for (const s of [-1, 1]) {
            const u = new THREE.Vector3(s * 0.33, 0.33, 0.86).normalize()
            const P = new THREE.Vector3(C.x + rxh * u.x, C.y + ryh * u.y, C.z + rzh * u.z)
            const nrm = new THREE.Vector3(u.x / rxh, u.y / ryh, u.z / rzh).normalize()
            const eye = new THREE.Group()
            eye.position.copy(P)
            eye.quaternion.setFromUnitVectors(zAxis, nrm)
            eye.scale.set(0.78, 1, 1)
            const erim = new THREE.Mesh(new THREE.CircleGeometry(0.144, 30), eyeDark)
            erim.position.z = 0.002
            eye.add(erim)
            const wht = new THREE.Mesh(new THREE.CircleGeometry(0.123, 30), eyeWhite)
            wht.position.z = 0.006
            eye.add(wht)
            const iris = new THREE.Mesh(new THREE.CircleGeometry(0.075, 26), eyeDark)
            iris.position.set(0, -0.005, 0.01)
            eye.add(iris)
            const hi = new THREE.Mesh(new THREE.CircleGeometry(0.025, 18), eyeWhite)
            hi.position.set(0.02, 0.038, 0.014)
            eye.add(hi)
            bee.add(eye)
          }

          // 더듬이(줄기 + 끝 공, 실제 방향으로 정렬)
          const up = new THREE.Vector3(0, 1, 0)
          for (const s of [-1, 1]) {
            const base = new THREE.Vector3(s * 0.14, 0.62, 1.06)
            const dir = new THREE.Vector3(s * 0.45, 1.0, 0.5).normalize()
            const len = 0.42
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, len, 12), black)
            stem.position.copy(base.clone().addScaledVector(dir, len / 2))
            stem.quaternion.setFromUnitVectors(up, dir)
            bee.add(stem)
            const knob = new THREE.Mesh(new THREE.SphereGeometry(0.062, 16, 16), black)
            knob.position.copy(base.clone().addScaledVector(dir, len))
            bee.add(knob)
          }

          // 날개: 뿌리는 머리·어깨(+z)에 모이고 꼬리(−z)로 퍼지는 납작 반투명 타원체
          const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.42, roughness: 0.2, side: THREE.DoubleSide, depthWrite: false })
          for (const s of [-1, 1]) {
            const wing = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 18), wingMat)
            wing.scale.set(0.46, 0.05, 0.95)
            const root = new THREE.Vector3(s * 0.18, 0.6, 0.46)
            const tip = new THREE.Vector3(s * 1.02, 0.48, -0.66)
            wing.position.copy(root.clone().add(tip).multiplyScalar(0.5))
            wing.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tip.clone().sub(root).normalize())
            bee.add(wing)
          }

          g.add(bee)

          // 여왕벌: 머리 위 금색 띠 + 뿔 6개 + 원판 빨간 링
          if (queen) {
            const gold = new THREE.MeshStandardMaterial({ color: 0xffd24a, roughness: 0.32, metalness: 0.55 })
            const band = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.29, 0.16, 16), gold)
            band.position.set(0, 0.82, 0.98)
            bee.add(band)
            for (let i = 0; i < 6; i++) {
              const a = (i / 6) * Math.PI * 2
              const sp = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.12, 8), gold)
              sp.position.set(Math.sin(a) * 0.17, 0.94, 0.98 + Math.cos(a) * 0.17)
              bee.add(sp)
            }
            const ring = new THREE.Mesh(new THREE.TorusGeometry(1.78, 0.05, 12, 90), new THREE.MeshStandardMaterial({ color: 0xcf2a1c, roughness: 0.5 }))
            ring.rotation.x = Math.PI / 2
            ring.position.y = 0.31
            g.add(ring)
          }
          return g
        }

        // 핸드오프 piece(원판 반지름 2)를 타일(반지름 0.92)에 맞게 축소·배치. 원판 바닥을 타일 윗면에.
        const PIECE_K = 0.33 // 2 * 0.33 ≈ 0.66 ≤ 타일
        const layout = [
          [0, 0, 'yellow', false],
          [1.6, 0, 'brown', false],
          [-1.6, 0, 'brown', true],
          [0.8, 1.4, 'yellow', false],
          [-0.8, 1.4, 'yellow', true],
          [0.8, -1.4, 'brown', false],
          [-0.8, -1.4, 'yellow', false],
        ]
        for (const [x, z, side, queen] of layout) {
          const t = hexTile(TILE[side])
          t.position.set(x, 0, z)
          scene.add(t)
          const tk = buildPiece(side, queen)
          tk.scale.setScalar(PIECE_K)
          tk.position.set(x, 0.22 + 0.3 * PIECE_K, z) // 원판 바닥(−0.3*K)을 타일 윗면(0.22)에
          scene.add(tk)
        }

        const controls = new OrbitControls(camera, renderer.domElement)
        controls.target.set(0, 0.4, 0)
        controls.enableDamping = true
        controls.autoRotate = true
        controls.autoRotateSpeed = 1.4
        controls.minDistance = 3
        controls.maxDistance = 14

        addEventListener('resize', () => {
          camera.aspect = innerWidth / innerHeight
          camera.updateProjectionMatrix()
          renderer.setSize(innerWidth, innerHeight)
        })

        function loop() {
          controls.update()
          renderer.render(scene, camera)
          window.__rendered = true
          requestAnimationFrame(loop)
        }
        loop()
      } catch (e) {
        console.error(e)
        document.getElementById('err').style.display = 'flex'
        document.getElementById('hint').style.display = 'none'
      }
    </script>
  </body>
</html>
